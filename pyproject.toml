[project]
name = "api_data_load"
version = "0.1.0"
description = "Data Scraping VAN supply site for Family planning supply Data"
readme = "README.md"
authors = [
    { name = "Basil Okola", email = "33178339+Bokola@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pandera[pandas]>=0.32.1",
    "playwright>=1.62.0",
    "playwright-stealth>=2.0.3",
    "pyarrow>=25.0.1",
    "pytest-playwright>=0.9.0",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.4",
]

[project.scripts]
api-data-load = "api_data_load:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.setuptools.packages.find]
where = ["src"]  # tells setuptools to look in the root directory
