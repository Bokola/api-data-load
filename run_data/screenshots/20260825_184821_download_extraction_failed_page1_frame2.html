<!DOCTYPE html><html style="color-scheme: light;"><head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="Cache-Control" content="public">
<meta http-equiv="Cache-Control" content="max-age=120000">
<meta http-equiv="Expires" content="Wed, 26 Feb 2080 08:21:57 GMT">
</head>
<body>
<div class="tail-tag" style="position:relative" data-iframe-height=""></div>
<script language="javascript" type="text/javascript" src="./js/util/RcpTop.js"></script>
<script>
  window.iFrameResizer = {
    onMessage: function (info) {}
  }
  if(rcptop.selectedTheme) {
    window.document.documentElement.style.setProperty('color-scheme', rcptop.selectedTheme);
  } else {
    let url = new URL(window.location.href);
    let params = new URLSearchParams(url.search);
    if(params && params.has('theme')) {
      window.document.documentElement.style.setProperty('color-scheme', params.get('theme'));
    }
  }
</script>
<script language="javascript" type="text/javascript" src="./js/bower_components/iframe-resizer/js/iframeResizer.contentWindow.min.js"></script>


</body></html>
