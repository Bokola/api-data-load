<script language="javascript" type="text/javascript" src="./js/util/Common.jsp?cacheProperty=gfpvan2536-en"></script>

<script language="javascript" type="text/javascript" src="./js/bower_components/jquery/dist/jquery.min.js?cacheProperty=gfpvan2536-en"></script>

<script language="JavaScript" type="text/javascript">

var frameNamePrefix = 'LowerSection';

var pagesLoaded = new Array();
pagesLoaded[pagesLoaded.length] = frameNamePrefix + '0';


var buttonProcessingTimerId = '';
var currentFrame = '';
var isNewFrame = false;

var allCollabIds = '1382|1383|1384|1385|1363|1364|1365|1366|';
var gcommand = 'null';
var mcvRowHeight = 49;

function init() {
  //get the dummy mcv row height and remove it
  mcvRowHeight = jQuery('#dummyGrid .eto-grid-scroll tr:nth(1)').height() || mcvRowHeight;
  jQuery('#dummyGrid').remove();
  
  var pageUrl = getPageUrl();
  var pageNo = document.mcvContainerForm.PageNo.value;
  var prefix = 'LowerSection';
  var sectionNamePre = true ? "": prefix + ".";
  rcptop.currentContext.addItem('CTX:' + sectionNamePre + 'currentPageNoClearBC', pageNo);
  rcptop.currentContext.removeItem("CTX:bpmCreateErrorIds");
  
  
  
  var theFrame = document.getElementById(frameNamePrefix + pageNo);
  var createFrameCallback = function() {
    currentFrame = frameNamePrefix + pageNo;
    theFrame = document.getElementById(frameNamePrefix + pageNo);
    loadFrame(pageUrl, theFrame);
    showFrame(frameNamePrefix + pageNo);
    if(buttonProcessingTimerId == '')
      buttonProcessingTimerId = window.setInterval("updateButtonsOnInit()", 200);
    alignCols(frameNamePrefix + pageNo);
  }
  if(!theFrame) {
    var frameid = frameNamePrefix + pageNo;
    theFrame = createFrame(frameid);
    isNewFrame = true;
    createOneTimeListener(theFrame, 'load', function() {
      createFrameCallback();
    });
  } else {
    isNewFrame = false;
    createFrameCallback();
  }
  
}

function alignCols(frameId) {
  //Trigger resize on other section
  var sectionName = 'LowerSection';
  if(isPageLoaded()) {
    var message = JSON.stringify({
      frameId: frameId
    });
    if(gcommand == 'updatePits' && sectionName == 'UpperSection') {
      sendSynMessage(sectionName+"Updated", message);
    } else {
      var pageNo = document.mcvContainerForm.PageNo.value;
      var theFrame = document.getElementById(frameNamePrefix + pageNo);
      if(theFrame) {
        if (theFrame.contentWindow && theFrame.contentWindow.document && theFrame.contentWindow.reSizeGrid) {
              theFrame.contentWindow.reSizeGrid();
          }
      }
     sendSynMessage(sectionName+"Loaded", message);
    }
    return;
  } else {
    window.setTimeout(alignCols, 500);
  }
}

function resize(frameId) {
}

function isPageLoaded() {
  if(!document || !document.mcvContainerForm)
    return false;
  var pageNo = document.mcvContainerForm.PageNo.value;
  theFrame = document.getElementById(frameNamePrefix + pageNo);
  if(theFrame) {
    if (theFrame.contentWindow && theFrame.contentWindow.document &&
        theFrame.contentWindow.pageLoaded)
        return true;
  }
  return false;
}

function getCurrentPageFrameName() {
  return currentFrame;
}

function createFrame(frameid) {
  var theFrame = document.createElement("iframe");
  theFrame.src = 'blank.html';
  theFrame.id = frameid;
  theFrame.name = frameid;
  theFrame.width = '100%';
  theFrame.height = '100%';
  theFrame.frameBorder = 0;
  theFrame.scrolling = 'auto';
  theFrame.framespacing = 0;
  theFrame.marginHeight = 0;
  theFrame.marginWidth = 0;
  var frameObj = document.getElementById(frameNamePrefix + '0');
  frameObj.parentNode.appendChild(theFrame);
  document.getElementById(frameid).contentWindow.document.offsetTop = 0;
  document.getElementById(frameid).contentWindow.document.offsetLeft = 0;
  pagesLoaded[pagesLoaded.length] = frameid;
  jQuery('#' + frameid).iFrameResize({heightCalculationMethod:'taggedElement'});
  return theFrame;
}

function showFrame(showFrame) {
  var iframes = document.getElementsByTagName("iframe");
  for(var i = 0; i < iframes.length; i++) {
    var fr = iframes[i];
    if(fr.id == showFrame)
      fr.style.display = 'block';
    else
      fr.style.display = 'none';
  }
}

function loadFrame(pageUrl, theFrame) {
  submitHiddenForm(pageUrl, theFrame);
}

function submitHiddenForm(pageUrl, theFrame) {
  rcptop.wfm.submitHiddenContextForm(pageUrl,theFrame.name,true);
}

function getPageUrl() {
  var url = document.mcvContainerForm.DefaultURL.value;
  url +=  '&PageNo=' + document.mcvContainerForm.PageNo.value +
          '&StartIndex=' + document.mcvContainerForm.StartIndex.value +
          '&Mcv.PageSize=' + document.mcvContainerForm.elements['Mcv.PageSize'].value +
          '&ViewVariant=' + document.mcvContainerForm.ViewVariant.value +
          '&StartDate=' + document.mcvContainerForm.StartDate.value +
          '&EndDate=' + document.mcvContainerForm.EndDate.value +
          '&Calendar=' + document.mcvContainerForm.Calendar.value +
          '&DisplayCols=' + document.mcvContainerForm.DisplayCols.value +
          '&SortCols=' + document.mcvContainerForm.SortCols.value +
          '&SortDir=' + document.mcvContainerForm.SortDir.value +
          '&BandColumn=' + document.mcvContainerForm.BandColumn.value;
          
  if(document.mcvContainerForm.DM_NAMES.value != '')
    url += '&DM_NAMES=' + document.mcvContainerForm.DM_NAMES.value;
  if(document.mcvContainerForm.ExpandableDMs && document.mcvContainerForm.ExpandableDMs.value != '')
    url += '&ExpandableDMs=' + document.mcvContainerForm.ExpandableDMs.value;
  if(document.mcvContainerForm.BucketPattern.value != '')
     url += '&BucketPattern=' + document.mcvContainerForm.BucketPattern.value;
  if(document.mcvContainerForm.Command.value != '')
    url += '&Command=' + document.mcvContainerForm.Command.value;
  if(document.mcvContainerForm['DMSelector.Save'].value != '')
    url += '&DMSelector.Save=' + document.mcvContainerForm['DMSelector.Save'].value;
  if(document.mcvContainerForm['DMSelector.Reset'].value != '')
    url += '&DMSelector.Reset=' + document.mcvContainerForm['DMSelector.Reset'].value;
  if(document.mcvContainerForm.PrintError.value != '')
    url += '&PrintError=' + document.mcvContainerForm.PrintError.value;

    url += '&BpmCreateErrorIds=' + '';

  url += '&screenSize=' +  Math.ceil(window.screen.height) + '&rowHeight=' +  Math.ceil(mcvRowHeight);
  if(false) url += '&disableIncrementalLoading=' +  true;
  return url;
}
function paging(pageNo, command) {
  var prefix = 'LowerSection';
  var sectionNamePre = true ? "": prefix + ".";
  rcptop.currentContext.addItem('CTX:' + sectionNamePre + 'currentPageNoClearBC', pageNo);
  //Update variant info
  updateVariantInfo(document.mcvContainerForm.PageNo.value);
  //Update filter info
  updateFilterInfo(document.mcvContainerForm.PageNo.value);
  //Update sorting info
  updateDisplayInfo(document.mcvContainerForm.PageNo.value);
  //Update paging info
  updatePageInfo(document.mcvContainerForm.PageNo.value);
  document.mcvContainerForm.PageNo.value = pageNo;
  document.mcvContainerForm.Command.value = command;
  var pageUrl = getPageUrl();
  var frameid = frameNamePrefix + pageNo;
  var theFrame = document.getElementById(frameid);
  var createFrameCallback = function() {
    loadFrame(pageUrl, theFrame);
    showFrame(frameid);
    currentFrame = frameid;
    if(buttonProcessingTimerId == '')
      buttonProcessingTimerId = window.setInterval("updateButtonsOnInit()", 200);
    resize();
    gcommand = "paging";
    alignCols(frameid);    
  }
  if(!theFrame) {
    createFrame(frameid);
    theFrame = document.getElementById(frameid);
    createOneTimeListener(theFrame, 'load', function() {
      createFrameCallback();
    });
    isNewFrame = true;
  } else {
    if (!theFrame.contentWindow || !theFrame.contentWindow.pageLoaded) {
      isNewFrame = true;
    } else {
      isNewFrame = false;
    }
    createFrameCallback();
  }
}

function loadViewVariant(pageNo) {
  refresh(false, pageNo);
}

function switchSummary(pageNo) {
  setParameters(pageNo);

  rcptop.currentContext.addItem("CTX:SelectedTab", 'summary');
  rcptop.currentContext.addItem("CTX:tabName", 'summary');

  document.mcvContainerForm.action = "mcvSummaryComponent.do";
  showTopLoader();
  document.mcvContainerForm.submit();
}


function refresh(refreshContainer, pageNo) {
  if(pageNo) {
    //Update variant info
    updateVariantInfo(pageNo);
    //Update filter info
    updateFilterInfo(pageNo);
    //Update sorting info
    updateDisplayInfo(pageNo);
    //Update paging info
    updatePageInfo(pageNo);
    document.mcvContainerForm.PageNo.value = pageNo;
  }
  document.mcvContainerForm.Command.value = 'refresh';
  showTopLoader();
  
  if(refreshContainer) {
    var sectionName = 'LowerSection';
    var compositeFrame = null;
    if(sectionName == 'UpperSection') {
      compositeFrame = window.parent.parent.document.getElementById("rcp_content").contentWindow;
    } else if(parent) {
      compositeFrame = parent;
    }
    if(compositeFrame && compositeFrame.refresh) {
      compositeFrame.refresh(document.mcvContainerForm.StartDate.value, document.mcvContainerForm.EndDate.value, document.mcvContainerForm.Calendar.value);
    }
  } else {
    document.mcvContainerForm.submit();
  }
}

function reconfigure(pageNo, configuratorSave, configuratorReset) {
  setParameters(pageNo, true);
  var url = document.mcvContainerForm.action;
  if(configuratorSave)
    url += '&Configurator.Save=true';
    
  if(configuratorReset)
    url += '&Configurator.Reset=true';

  document.mcvContainerForm.action = url;
  document.mcvContainerForm.submit();
}

function changePageSize(size, pageNo) {
  setParameters(pageNo);

  document.mcvContainerForm.elements['Mcv.PageSize'].value = size;
  document.mcvContainerForm.submit();
}

function showPrintError(refreshContainer, errorFilePath, pageNo) {
  document.mcvContainerForm.PrintError.value = decodeURIComponent(errorFilePath);
  refresh(refreshContainer, pageNo);
}

function dmSelectConfigure(pageNo, dmSelectorSave, dmSelectorReset) {
  setParameters(pageNo, true);
  var url = document.mcvContainerForm.action;
    document.mcvContainerForm.action = url;
    document.mcvContainerForm['DMSelector.Save'].value = dmSelectorSave;
    document.mcvContainerForm['DMSelector.Reset'].value = dmSelectorReset;
    document.mcvContainerForm.submit();
}

function setParameters(pageNo, skipResetPageNo) {
  //Update variant info
  updateVariantInfo(pageNo);
  //Update filter info
  updateFilterInfo(pageNo);
  //Update sorting info
  updateDisplayInfo(pageNo);
  
  if(!skipResetPageNo) {
    //Reset Page Info
    document.mcvContainerForm.PageNo.value = '';
    document.mcvContainerForm.StartIndex.value = '0';
    document.mcvContainerForm.Command.value = '';
  } else {
    // skip reset page in when it comes from dimension table configurator and dm selection
    document.mcvContainerForm.Command.value = 'refresh';
  }
}

function updateDisplayInfo(pageNo) {
  var theFrame = document.getElementById(frameNamePrefix + pageNo);
  theFrameForm = theFrame.contentWindow.document.mcvForm;

  document.mcvContainerForm.DisplayCols.value = theFrameForm.DisplayCols.value;
  document.mcvContainerForm.SortCols.value = theFrameForm.SortCols.value;
  document.mcvContainerForm.SortDir.value = theFrameForm.SortDir.value;
  document.mcvContainerForm.BandColumn.value = theFrameForm.BandColumn.value;
}

function updatePageInfo(pageNo) {
  var theFrame = document.getElementById(frameNamePrefix + pageNo);
  theFrameForm = theFrame.contentWindow.document.mcvForm;
  document.mcvContainerForm.StartIndex.value = theFrameForm.StartIndex.value;
  document.mcvContainerForm.elements['Mcv.PageSize'].value = theFrameForm.elements['Mcv.PageSize'].value;
}

function updateVariantInfo(pageNo) {
  var theFrame = document.getElementById(frameNamePrefix + pageNo);
  theFrameForm = theFrame.contentWindow.document.mcvForm;
  if(theFrameForm.ViewVariant)
  document.mcvContainerForm.ViewVariant.value = theFrameForm.ViewVariant.value;
  if(theFrameForm.SummaryVariant)
    document.mcvContainerForm.SummaryVariant.value = theFrameForm.SummaryVariant.value;
}

function updateFilterInfo(pageNo) {
  var theFrame = document.getElementById(frameNamePrefix + pageNo);
  theFrameForm = theFrame.contentWindow.document.mcvForm;
  document.mcvContainerForm.StartDate.value = theFrameForm.START_DATE.value;
  document.mcvContainerForm.EndDate.value = theFrameForm.END_DATE.value;
  document.mcvContainerForm.Calendar.value = theFrameForm.Calendars.value;
  document.mcvContainerForm.DM_NAMES.value = theFrameForm.DM_NAMES.value;
  if (document.mcvContainerForm.ExpandableDMs && theFrameForm.ExpandableDMs) {
    document.mcvContainerForm.ExpandableDMs.value = theFrameForm.ExpandableDMs.value;
  }
  document.mcvContainerForm.BucketPattern.value = theFrameForm.BucketPattern.value;
}

function collectCollabs() {
  return document.mcvContainerForm.SelectedIds.value;
}

function clearAll() {
  document.mcvContainerForm.SelectedIds.value = "";
  document.mcvContainerForm.SelectAll.value = "";

  for(var i = 0; i < pagesLoaded.length; i++) {
    var frameId = pagesLoaded[i];
    var theFrame = document.getElementById(frameId);
    if(theFrame) {
      theFrame.contentWindow.setSelectAllCheckBox(false);
      theFrame.contentWindow.checkAll(false);
      processUpdateButtons(theFrame.contentWindow.document, false);
    }
  }
}

function cleanSelectAll() {
  document.mcvContainerForm.SelectAll.value = "";
  for(var i = 0; i < pagesLoaded.length; i++) {
    var frameId = pagesLoaded[i];
    var theFrame = document.getElementById(frameId);
    if(theFrame) {
      theFrame.contentWindow.setSelectAllCheckBox(false);
    }
  }
}

function selectAllAcrossPages() {
  document.mcvContainerForm.SelectedIds.value = allCollabIds;
  document.mcvContainerForm.SelectAll.value = "true";

  for(var i = 0; i < pagesLoaded.length; i++) {
    var frameId = pagesLoaded[i];
    var theFrame = document.getElementById(frameId);
    if(theFrame) {
      theFrame.contentWindow.setSelectAllCheckBox(true);
      theFrame.contentWindow.checkAll(true);
      processUpdateButtons(theFrame.contentWindow.document, true);
    }
  }
}

function updateSelectedIds(collabId, add) {
  var collabIds = document.mcvContainerForm.SelectedIds.value;
  var collabIdsArray = collabIds.split('|');
  if (add) {
    var contains = false;
    for (var i = 0; i < collabIdsArray.length; i++) {
      if (collabIdsArray[i] == collabId) {
        contains = true;
        break;
      }
    }
    if (!contains) {
      if (collabIds == "")
        document.mcvContainerForm.SelectedIds.value = collabId;
      else
        document.mcvContainerForm.SelectedIds.value = collabIds + '|'
            + collabId;
    }
  } else {
    var ids = "";
    for (var i = 0; i < collabIdsArray.length; i++) {
      if (collabIdsArray[i] != collabId) {
        if (ids == "")
          ids += collabIdsArray[i];
        else
          ids += '|' + collabIdsArray[i];
      }
    }
    document.mcvContainerForm.SelectedIds.value = ids;
  }
  processUpdateButtonsForAllLoadedPages();
}

function updateButtonsOnInit() {
  var theFrame = document.getElementById(currentFrame);

  if (!theFrame.contentWindow || !theFrame.contentWindow.document || !theFrame.contentWindow.pageLoaded || !theFrame.contentWindow.document.forms[0])
    return;

  if(theFrame.contentWindow.document.forms[0].name != 'mcvForm') {
    window.clearInterval(buttonProcessingTimerId);
    buttonProcessingTimerId = '';
    return;
  }

  var pageNo = currentFrame.substring(frameNamePrefix.length);
  //Update variant info
  updateVariantInfo(pageNo);
  //Update filter info
  updateFilterInfo(pageNo);
  //Update sorting info
  updateDisplayInfo(pageNo);
  //Update paging info
  updatePageInfo(pageNo);

  if(document.mcvContainerForm.SelectAll.value == 'true') {
    theFrame.contentWindow.setSelectAllCheckBox(true);
    theFrame.contentWindow.checkAll(true);
    processUpdateButtons(theFrame.contentWindow.document, true);
    window.clearInterval(buttonProcessingTimerId);
    buttonProcessingTimerId = '';
    isNewFrame = false;
  } else {
    processUpdateButtonsForAllLoadedPages();
    window.clearInterval(buttonProcessingTimerId);
    buttonProcessingTimerId = '';
    isNewFrame = false;
  }
}

function processUpdateButtonsForAllLoadedPages(callFromUpper) {
  var hasChecked = false;
  var selectedIdsStr = document.mcvContainerForm.SelectedIds.value;
  if(selectedIdsStr != '') {
    var ids = selectedIdsStr.split('|');
    if(ids.length > 0)
      hasChecked = true;
  }
  for(var i = 0; i < pagesLoaded.length; i++) {
    var frameId = pagesLoaded[i];
    var theFrame = document.getElementById(frameId);
    if(theFrame) {
      if(hasChecked && theFrame.contentWindow.isDirty)
        processUpdateButtons(theFrame.contentWindow.document, true, callFromUpper);
      else
        processUpdateButtons(theFrame.contentWindow.document, false, callFromUpper);
    }
  }
}

function processUpdateButtons(doc, updateEnabled, callFromUpper) {
  var buttons = new Array();
  buttons[0] = 'updateBtn';
  buttons[1] = 'resetBtn';
  for(var i = 0; i < buttons.length; i++) {
    var btn = doc.getElementById(buttons[i]);
    if(updateEnabled) {
      jQuery(btn).removeAttr("disabled");
    } else {
      jQuery(btn).attr("disabled", "");
    }
  }
  
  if(doc.getElementsByName('Section').length > 0 && !callFromUpper) {
    var sectionName = doc.getElementsByName('Section')[0].value;
    //toggle lowersection update bt.
    var message = JSON.stringify({
      updateEnabled: updateEnabled
    });
    sendSynMessage(sectionName+"Changed", message);
  }
}

function writeField(fieldName, val) {
  var field = document.mcvContainerForm.elements[fieldName];
  if(field) {
    document.mcvContainerForm.elements[fieldName].value = val;
    return;
  }
  val = escapeDoubleQuote(val);
  var inputType = document.createElement('input');
  inputType.name = fieldName;
  inputType.type = 'hidden';
  inputType.setAttribute('id', fieldName);
  inputType.setAttribute('value', val);
  document.getElementById('mcvContainerForm').appendChild(inputType);
}

function escapeDoubleQuote(str) {
  if (str.indexOf("\"")==-1) return str;
  var list = str.split("\"");
  str = list.join("&#034;");
  return str;
}

function writeFields(fieldsToWrite) {
  const fragment = document.createDocumentFragment();
  fieldsToWrite.forEach(function(val, fieldName) {
    const field = document.querySelector('input[name="' + jqSelector(fieldName) + '"]');
    if(field) {
      field.value = val;
    } else {
      val = escapeDoubleQuote(val);
      const inputType = document.createElement('input');
      inputType.name = fieldName;
      inputType.type = 'hidden';
      inputType.setAttribute('id', fieldName);
      inputType.setAttribute('value', val);
      fragment.appendChild(inputType);
    }
  });
  document.getElementById('mcvContainerForm').appendChild(fragment);
}

function update(pageNo, command) {
  //Update variant info
  updateVariantInfo(pageNo);
  //Update filter info
  updateFilterInfo(pageNo);
  //Update sorting info
  updateDisplayInfo(pageNo);

  updatePageInfo(pageNo); 

  document.mcvContainerForm.PageNo.value = pageNo;
  document.mcvContainerForm.Command.value = command;

  document.mcvContainerForm.submit();

  displayProgressBar();
}
  
function updatePit(pitName) {
  document.mcvContainerForm.UpdatedPits.value += '^' + pitName;
}

function removeUpdatedPit(pitName) {
  var names = document.mcvContainerForm.UpdatedPits.value.split('^');
  document.mcvContainerForm.UpdatedPits.value = '';
  for (var i = 0; i < names.length; i++)
    if (names[i] != pitName)
      document.mcvContainerForm.UpdatedPits.value += names[i] + '^';
}


function updateIODocInfo(docType, docTypeParams, selectedIds, printFilterParams) {
  document.mcvContainerForm.IoDocType.value = docType;
  document.mcvContainerForm.IoDocTypeParams.value = docTypeParams;
  document.mcvContainerForm.IoSelectedIds.value = selectedIds;
  document.mcvContainerForm.IoPrintFilterParams.value = printFilterParams;
}


function displayProgressBar() {
  
  var iframes = document.getElementsByTagName("iframe");
  for(var i = 0; i < iframes.length; i++) {
    var fr = iframes[i];
    fr.style.display = 'none';
  }
  showTopLoader();
}

function refreshSection(startDate, endDate, calendar) {
  document.mcvContainerForm.StartDate.value = startDate;
  document.mcvContainerForm.EndDate.value = endDate;
  document.mcvContainerForm.Calendar.value = calendar;
  document.mcvContainerForm.Command.value = 'refresh';

  document.mcvContainerForm.submit();
}

function isChanged() {
  var message = 'WARNING!!! YOU HAVE NOT UPDATED (SAVED) YOUR CHANGES. Click CANCEL to return to current view; Click OK to proceed WITHOUT saving.';
  for(var i = 0; i < pagesLoaded.length; i++) {
    var frameId = pagesLoaded[i];
    var theFrame = document.getElementById(frameId);
    if(theFrame) {
      if(theFrame.contentWindow.isDirty == true) {
        var keepChanges = !confirm(message);
        return keepChanges;
      }
    }
  }
  return false;
}

function exportPage() {
  if(parent && parent.exportPage)
    parent.exportPage();
}

function exportSection() {
  theFrame = document.getElementById(currentFrame);
  if(theFrame) {
    return theFrame.contentWindow.exportSection();
  }
  return "";
}

function sendSynMessage(type, message) {
  window.parent.parent.document.getElementById("rcp_content").contentWindow.postMessage("[" +type+"]"+message, window.location.origin ||
        window.location.protocol + "//" + window.location.hostname + (window.location.port ? ':' + window.location.port: ''));
}

function getPitGroupingFilterCriteria(pitGrouping) {
  var filterCriteria = '';
  jQuery("input[name='" + 'PI_FC' + pitGrouping + "']").each(function(index, input) {
    filterCriteria += '^' + jQuery(input).val();
  });
  return filterCriteria;
}

function getPrefillForPitGrouping(pitGrouping) {
  var prefill = "";
  jQuery("input[name^='" + 'PI_ATTR' + pitGrouping + "']").each(function(index, input) {
    var name = jQuery(input).attr('name');
    var attrName = name.substr(name.lastIndexOf('|') + '|'.length);
    prefill += attrName + '|' + jQuery(input).val() + '^'; 
  });
  return prefill;
}

function setToggleCollabs(toggleCollabs) {
  if(document.mcvContainerForm.ToggledCollab)
    document.mcvContainerForm.ToggledCollab.value =toggleCollabs;
}

function setLoadedCollabIds(collabIds) {
  if(document.mcvContainerForm.CURRENT_COLLAB_IDS.value) {
    document.mcvContainerForm.CURRENT_COLLAB_IDS.value += '|';
  }
  document.mcvContainerForm.CURRENT_COLLAB_IDS.value +=collabIds;
}
</script>
</head>

    setupStickyFooter: function () {
      var footer = window.jQuery('.sticky-footer');

        var wrapper = window.jQuery('.sticky-footer-wrapper');

          var gridHeaders = window.jQuery('.eto-grid thead th');

            '<div class="footer-scroller-inner" style="height:1px">&nbsp;</div></div>');
          var scroller = window.jQuery('.sticky-footer-wrapper .footer-scroller');

          // sync grid scroller
          var syncFunc = function() {
            var master = window.jQuery(this);
            var slave = master.hasClass('footer-scroller') ? grid : scroller;
            slave.off('scroll', null, syncFunc);
            slave.scrollLeft(master.scrollLeft());

      }
    },
    
    adjustHeaderFooter: function(info) {
      if(!window.iFrameResizer.hasStickyFooter) {
        return;
      }
      var result = window.iFrameResizer.calculateY(info);
      // hide header/footer if need to move them
      if(result.header && result.headerY != 0) {

      }
      if(result.footer && result.footerY != 0) {
        result.footer.css({opacity:0});
      }

      clearTimeout(window.iFrameResizer.delayTimer);
      window.iFrameResizer.delayTimer = setTimeout(function() {
        window.iFrameResizer.delayTimer = null;
        // move header/footer and show them
        if(result.header) {
          result.header.css({opacity:1,transform: 'translateY(' + result.headerY + 'px)', '-webkit-transform': 'translateY(' + result.headerY + 'px)'});
          //Save to localStorage
          
        }
        if(result.footer) {
          result.footer.css({opacity:1,transform: 'translateY(' + result.footerY + 'px)', '-webkit-transform': 'translateY(' + result.footerY + 'px)'});
        }

      }, 200);
    },

    calculateY: function (info) {
      var result = {};
      var tail = window.jQuery('.sticky-footer-wrapper-tail');
      var wrapper = window.jQuery('.sticky-footer-wrapper');
      var gridHeight = Infinity;
      if(wrapper.length) {

          result.header = gridHeaders;
          result.headerY = Math.min(gridHeight, Math.max(info.headerOffset + info.scrollTop - info.offsetTop - grid.offset().top, 0));

        // translate footer up
        result.footer = wrapper;
        result.footerY = Math.max(-gridHeight, Math.min(info.viewportHeight + info.scrollTop - info.offsetTop - tail.offset().top, 0));
      }
      return result;
    },

      var wrapper = window.jQuery('.sticky-footer-wrapper');
