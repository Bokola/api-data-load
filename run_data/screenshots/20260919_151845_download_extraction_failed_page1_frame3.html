<script language="JavaScript" type="text/javascript">
var isSingle = "mcv" != 'splitMCV';
var resizeTimerId = '';
function init() {
  if(!isSingle) {
    rcptop.showStickySection();
    submitForm(document.upperSectionForm);
  }
  submitForm(document.lowerSectionForm);
}

function updateCtx(frame1Size, frame2Size) {
  if(!frame1Size)
    frame1Size = '';
  if(!frame2Size)
    frame2Size = '';
  document.splitMCVForm.elements['UpperSection.frameSize'].value = frame1Size;
  document.splitMCVForm.elements['LowerSection.frameSize'].value = frame2Size;
  rcptop.currentContext.addItem("CTX:UpperSection.frameSize", document.splitMCVForm.elements['UpperSection.frameSize'].value);
  rcptop.currentContext.addItem("CTX:LowerSection.frameSize", document.splitMCVForm.elements['LowerSection.frameSize'].value);
}

function submitForm(formToSubmit) {
  formToSubmit.submit();
  return false;
}

function refresh(startDate, endDate, calendar, excludeComponent) {
  if(!(excludeComponent && excludeComponent.startsWith('UpperSection'))) {
    var upperSectionFrame = parent.document.getElementById('sticky-frame').contentWindow;//findUpperFrameContent();
    if(upperSectionFrame && upperSectionFrame.refreshSection) {
      if(!isSingle) {
        frameUloaded = false;
      }
      upperSectionFrame.refreshSection(startDate, endDate, calendar);
    }
  }
  if(!(excludeComponent && excludeComponent.startsWith('LowerSection'))) {
    var lowerSectionFrame = document.getElementById('LowerSectionFrame');
    frameLloaded = false;
    lowerSectionFrame.contentWindow.refreshSection(startDate, endDate, calendar);
  }
}

function exportPage() {
  var upperSectionFrame = findUpperFrameContent();
  var lowerSectionFrame = document.getElementById('LowerSectionFrame');

  var upperSectionFile = upperSectionFrame.exportSection();
  var lowerSectionFile = lowerSectionFrame.contentWindow.exportSection();

  var file = '';
  if(upperSectionFile) {
    if(upperSectionFile.length > 0) {
      file += upperSectionFile;
      file += '\n';
    }
  }
  if(lowerSectionFile) {
    if(lowerSectionFile.length > 0)
      file += lowerSectionFile;
  }
  saveTableText(file, 'SplitMCV.tsv');
}

var syncScrollSource = '';
var upperscrollLeft = 0;
var lowerscrollLeft = 0;

</script>

<script>
  window.iFrameResizer = {
  
    hasStickyFooter: false,

    onReady: function () {
      window.parentIFrame.size();
      if(!window.jQuery || !window.eto) {
        console.warn('jQuery and edl are required to enable sticky header/footer');
        return;
      }
      if(true) {
        window.iFrameResizer.setupStickyFooter();
      }
      if(window.iFrameResizer.hasStickyFooter) {
        rcptop.sendPageInfo({type:"ready"});
      }
    },

    onMessage: function (info) {
      var x = -1, y = -1;
      if(false) {
        x = getUserData('Left_null', -1, 'localStorage');
        info.overrideX  = (x > -1) ? x : -1;
      } else {
        info.overrideX = -1;
      }
      window.iFrameResizer.adjustHeaderFooter(info);
      if(window.iFrameResize) {
        // relay to nested frames
        var frames = document.querySelectorAll('iframe');
        for (var i = 0; i < frames.length; i++) {
          if(frames[i].contentWindow.parentIFrame) {
            // adjust offsetTop and iframeHeight
            var iFramePosition = frames[i].getBoundingClientRect(), bodyPosition = document.body.getBoundingClientRect();
            var offsetTop = parseInt(iFramePosition.top  - bodyPosition.top,  10);
            var clonedInfo = JSON.parse(JSON.stringify(info));
            clonedInfo.iframeHeight = iFramePosition.height;
            clonedInfo.offsetTop = clonedInfo.offsetTop + offsetTop;
            var message = JSON.stringify(clonedInfo);
            frames[i].contentWindow.postMessage('[iFrameSizer]message:'+message, window.iFrameResizer.targetOrigin);
          }
        }
      }
    },

    setupStickyFooter: function () {
      var footer = window.jQuery('.sticky-footer');
      var grid = window.jQuery('.eto-grid .eto-grid-scroll:visible');
      if(footer.length) {
        // wrap footer inside a div with right style
        footer.wrap('<div class="sticky-footer-wrapper" '+
          'style="clear:both;position:relative;width:100%;background-color:white;z-index:10;transition:opacity 0.2s;opacity:1;"></div>');
        var wrapper = window.jQuery('.sticky-footer-wrapper');
        if(grid.length) {
          // setup grid header style
          var gridHeaders = window.jQuery('.eto-grid thead th');
          gridHeaders.css({position:'relative', 'z-index':10, transition:'opacity 0.2s', opacity:1});

          // insert scroller before footer
          wrapper.prepend('<div class="footer-scroller" style="height:18px;overflow-y:hidden;overflow-x:auto;">'+
            '<div class="footer-scroller-inner" style="height:1px">&nbsp;</div></div>');
          var scroller = window.jQuery('.sticky-footer-wrapper .footer-scroller');

          // sync grid scroller
          var syncFunc = function() {
            var master = window.jQuery(this);
            var slave = master.hasClass('footer-scroller') ? grid : scroller;
            slave.off('scroll', null, syncFunc);
            slave.scrollLeft(master.scrollLeft());
            //Save to localStorage
            
            clearTimeout(window.iFrameResizer.syncTimer);
            window.iFrameResizer.syncTimer = setTimeout(function() {
              window.iFrameResizer.syncTimer = null;
              slave.on('scroll', syncFunc);
            }, 200);
          }
          scroller.on('scroll', syncFunc);
          grid.on('scroll', syncFunc);

          // attach grid listener
          var g = new eto.Grid({el: grid.parent()[0]});
          g.on('columnResize columnAction', window.iFrameResizer.updateScroller);
        }else {
          wrapper.prepend('<hr>');
        }
        wrapper.after('<div class="sticky-footer-wrapper-tail" style="clear:both;display:block;" />');
        window.iFrameResizer.hasStickyFooter = true;
      }
    },
    
    adjustHeaderFooter: function(info) {
      if(!window.iFrameResizer.hasStickyFooter) {
        return;
      }
      var result = window.iFrameResizer.calculateY(info);
      // hide header/footer if need to move them
      if(result.header && result.headerY != 0) {
        result.header.css({opacity:0});
      }
      if(result.footer && result.footerY != 0) {
        result.footer.css({opacity:0});
      }

      clearTimeout(window.iFrameResizer.delayTimer);
      window.iFrameResizer.delayTimer = setTimeout(function() {
        window.iFrameResizer.delayTimer = null;
        // move header/footer and show them
        if(result.header) {
          result.header.css({opacity:1,transform: 'translateY(' + result.headerY + 'px)', '-webkit-transform': 'translateY(' + result.headerY + 'px)'});
          //Save to localStorage
          
        }
        if(result.footer) {
          result.footer.css({opacity:1,transform: 'translateY(' + result.footerY + 'px)', '-webkit-transform': 'translateY(' + result.footerY + 'px)'});
        }
        window.iFrameResizer.updateScroller(info);
      }, 200);
    },

    calculateY: function (info) {
      var result = {};
      var tail = window.jQuery('.sticky-footer-wrapper-tail');
      var wrapper = window.jQuery('.sticky-footer-wrapper');
      var gridHeight = Infinity;
      if(wrapper.length) {
        var grid = window.jQuery('.eto-grid .eto-grid-scroll:visible');
        if(grid.length) {
          var gridBody = grid.find('tbody');
          gridHeight = Math.max(gridBody.outerHeight(true) - gridBody.find('tr').first().outerHeight(true), 0);
          var gridHeaders = window.jQuery('.eto-grid thead th');
          // translate header down when scroll past its top
          result.header = gridHeaders;
          result.headerY = Math.min(gridHeight, Math.max(info.headerOffset + info.scrollTop - info.offsetTop - grid.offset().top, 0));
        }

        // translate footer up
        result.footer = wrapper;
        result.footerY = Math.max(-gridHeight, Math.min(info.viewportHeight + info.scrollTop - info.offsetTop - tail.offset().top, 0));
      }
      return result;
    },

    updateScroller: function (info) {
      var wrapper = window.jQuery('.sticky-footer-wrapper');
      if(wrapper.length) {
        var grid = window.jQuery('.eto-grid .eto-grid-scroll:visible');
        if(grid.length) {
          var scroller = window.jQuery('.sticky-footer-wrapper .footer-scroller');
          var scrollerInner = window.jQuery('.sticky-footer-wrapper .footer-scroller .footer-scroller-inner');
          var gridWidth = grid.outerWidth(true);
          var gridInnerWidth = window.jQuery('.eto-grid .eto-grid-scroll table').outerWidth(true);

          if(info && info.overrideX && info.overrideX > -1) {
            grid.scrollLeft(info.overrideX);
          }
                    
          // update scroller width & position
          scrollerInner.outerWidth(gridInnerWidth);
          scroller.outerWidth(gridWidth);
          scroller.scrollLeft(grid.scrollLeft());
          scroller.offset({left : grid.offset().left});

          // hide or show scroller
          if('true' === grid.closest('.eto-grid').attr('data-no-scroller') || grid.is(':hidden')) {
            grid.css({'margin-bottom': '0px'});
            scroller.hide();
          } else {
            // hide native scroller
            grid.css({'margin-bottom': '-18px'});
            scroller.show();
          }
        }
      }
    },

    targetOrigin: window.location.origin ||
      window.location.protocol + "//" + window.location.hostname + (window.location.port ? ':' + window.location.port: '')
  };

  window.addEventListener('click', function(event) {
    if(this != rcptop) {
      rcptop.jQuery(rcptop.document).find('body').click();
    }
  });
  
  if(window.name === 'side_frame'|| window.name === 'sticky_frame' || window.top === window.self) {
    // attach window resize/scroll event when not inside iframe
    (function(undefined) {
      var prev = 0;
      var sendPageInfo = function(event) { var now = Date.now(); if(now - prev > 9) {
        prev = now;
        var bodyPosition = document.body.getBoundingClientRect(),
          info = {
            iframeHeight: bodyPosition.height,
            viewportHeight: Math.max(document.documentElement.clientHeight, window.innerHeight || 0),
            offsetTop: 0,
            scrollTop: window.pageYOffset,
            headerOffset: 0,
            type: event.type
          };
          window.iFrameResizer.onMessage(info);
        }};
        window.addEventListener('load', function(event) {
        window.iFrameResizer.setupStickyFooter();
        sendPageInfo(event);
      });
      window.addEventListener('resize', sendPageInfo);
      window.addEventListener('scroll', sendPageInfo);
      window.jQuery(window).on('sendPageInfo', sendPageInfo);
      window.sendPageInfo = sendPageInfo;
    })();
  } else if(window.frameElement && window.frameElement.id === 'popupModal') {
    // attach window resize/scroll event inside popup modal
    (function(undefined) {
      var prev = 0;
      var modalBody = jQuery(window.frameElement).closest('.eto-modal__body')[0];
      var sendPageInfo = function(event) { var now = Date.now(); if(now - prev > 9) {
        prev = now;
        var bodyPosition = document.body.getBoundingClientRect(), 
          modalBodyPadding = (modalBody) ? parseFloat(window.top.getComputedStyle(modalBody).paddingTop) : 0,
          info = {
            iframeHeight: bodyPosition.height,
            viewportHeight: modalBody.clientHeight || 0,
            offsetTop: modalBodyPadding || 0,
            scrollTop: modalBody.scrollTop,
            headerOffset: 0,
            type: event.type
          };
        window.iFrameResizer.onMessage(info);
      }};
      window.addEventListener('load', function(event) {
        sendPageInfo(event);
      });
      
      if(modalBody) {
        modalBody.addEventListener('scroll', sendPageInfo);
        modalBody.addEventListener('resize', sendPageInfo); 
      }
      jQuery(window).resize(sendPageInfo);
      jQuery(window).scroll(sendPageInfo);
      window.jQuery(window).on('sendPageInfo', sendPageInfo);
    })();
  }  

 
  //Force resize of the iframes based on the open menu
  jQuery('.eto-dropdown').each(function(index, elem) {
    var dropdown = new eto.Dropdown({el: elem});
    dropdown.on('opened', function() {
      //Remove marker from all menus before adding to the one that is open
      jQuery('.eto-dropdown__menu[data-iframe-height]').removeAttr('data-iframe-height');
      jQuery(':not(.eto-dropdown) .eto-dropdown__menu[data-affixed]').attr('data-iframe-height','');
    });
    dropdown.on('closed', function() {
      jQuery('.eto-dropdown .eto-dropdown__menu[data-iframe-height]').removeAttr('data-iframe-height');
    });
  });

  if (typeof initFormValidation === "function") {
    // call initFormValidation of Common.jsp to handler button click event when any validation failed
    initFormValidation();
  }
</script>

    if(!message || !$iframe) {
      return
    }
    var columnId = message.columnId;

    if(columnId.startsWith('data_')) {
      //data column
      $table = $iframe.find('.eto-grid-scroll table');
      columnIndx = parseFloat(columnId.substring('data_'.length), 10);
    } else {
      //frozen table
      $table = $iframe.find('.eto-grid-frozen:first table');
      columnIndx = $table.find('thead th[data-column="'+columnId+'"]');

        columnIndx = columnIndx[0].cellIndex;

      }
    }
    resizeColumn($table, columnIndx, width);
    reCalculateDescriptionRow();
  }
  
  function resizeColumn($table, columnIndx, width) {
    var col = $table.find('colgroup col:eq('+columnIndx+')');
    if(col && col.length > 0) {
      var orignWidth = parseFloat(col.css('width'), 10);
      var tableWidth = parseFloat($table.css('width'), 10);
      var delta = width - orignWidth;
      col.css('width', width);
      $table.css('width', tableWidth + delta);
    }
  }

    }
    
    var $lowerTitle = $lowerIframe.find('th.mcv-bucket-group .eto-grid-column__label:first');
    if($lowerTitle.length > 0) {
      var scrollLeft = $lowerIframe.find('.eto-grid-scroll').scrollLeft();
      $lowerTitle.css('left', scrollLeft);
    }
  }
  
  function addLowerIoButtonsToUpper($lowerIframe, $upperIframe){
    //remove
    $upperIframe.find('#fileDownloadMenu ul li[name="lowerIoBt"]').remove();
    //add
    var lowerBulkIoBts = $lowerIframe.find('#fileDownloadMenu li a'); 
    if(lowerBulkIoBts.length > 1) {
      $upperIframe.find('#fileDownloadMenu ul').append('<li name="lowerIoBt" role="separator" class="eto-dropdown__menu__divider"></li>');
      $upperIframe.find('#fileDownloadMenu ul').append('<li name="lowerIoBt" role="separator" class="eto-dropdown__menu-item"><b>'+'Lower Section'+'</b></li>');

      lowerBulkIoBts.each(function(index) {
        if(jQuery(this).parent().attr('id') != 'export') {
          var iobt = jQuery(this).html();
          $upperIframe.find('#fileDownloadMenu ul').append('<li name="lowerIoBt" role="menuitem"><a onclick="javascript: void executeLowerIo('+ index +')" >' + iobt + "</a></li>");
        }
      });
    }
  }
  
  function alignCols() {
    var $lowerIframe = findLowerFrame();
    if(!isSingle) {
      var $upperIframe = findUpperFrame();
      alignFrozenCols($lowerIframe, $upperIframe);
      alignDataCols($lowerIframe, $upperIframe);
      window.setTimeout(function() {
        //need some time for iframe resizer
        alignTotalCol($lowerIframe, $upperIframe);
      }, 200);
      addLowerIoButtonsToUpper($lowerIframe, $upperIframe);
    } else {
      if($lowerIframe.find('#mcvsynctables').is(":visible")) { 
        //when chat shows first, should not run fit data. Because mcv is hidden and it cannot get the data column width.
        alignDataCols($lowerIframe, $upperIframe); 
      }
    }
  }
  
  function reCalculateDescriptionRow() {
    //recalucate the legnth of mcv descript rows
    var upperSectionFrame = findUpperFrameContent();
    if(upperSectionFrame.onResize) {
      upperSectionFrame.onResize();
    }
    var lowerSectionFrame = findLowerFrameContent();
    if(lowerSectionFrame.onResize) {
      lowerSectionFrame.onResize();
    }
  }
  
  function alignTotalCol($lowerIframe, $upperIframe) {
    var $lowerTable = $lowerIframe.find('.eto-grid-frozen--right table');
    var $upperTable = $upperIframe.find('.eto-grid-frozen--right table');
    if(!$lowerTable.attr('orginalWidth')) {
      $lowerTable.attr('orginalWidth', $lowerTable.width());
    }
    var tmpstickyFrame = stickyFrame;
    if(stickyFrame.contentWindow && stickyFrame.contentWindow.document.getElementById('UpperSection0')) {
      tmpstickyFrame = stickyFrame.contentWindow.document.getElementById('UpperSection0');
    }
    
    //need check grid is full width
    var $body = jQuery(tmpstickyFrame).contents().find('body');
    var gridFullWidth =  $body.find('.eto-grid')[0].clientWidth;
    var frozenWidth =  $body.find('.eto-grid-frozen:first')[0].clientWidth;
    var dataWidth =  $body.find('.eto-grid-scroll')[0].clientWidth;
    var totalWidth = jQuery(tmpstickyFrame).contents().find('body .eto-grid-frozen:last')[0].clientWidth;
    var addWidth = 0;
    if(totalWidth + dataWidth + frozenWidth + 8 >= gridFullWidth) {
      addWidth = jQuery(tmpstickyFrame).contents().find('body')[0].clientHeight - stickyFrame.clientHeight > 0? scrollbarWidth: 0;
    }
    
    //if there is no scroll bar, need change the lower total column to orginal width
    if(addWidth == 0) {
      resizeAllColumnWidth($lowerTable, [{'width': $lowerTable.attr('orginalWidth')}]);
    }
    alignUpperandlowerCols ($lowerTable, $upperTable, addWidth);
  }
  function alignFrozenCols($lowerIframe, $upperIframe) {
    var $lowerTable = $lowerIframe.find('.eto-grid-frozen:first table');
    var $upperTable = $upperIframe.find('.eto-grid-frozen:first table');
    
    alignUpperandlowerCols ($lowerTable, $upperTable, 0);
  }
  
  function alignDataCols($lowerIframe, $upperIframe) {
    var $lowerTable, $upperTable;
    
    $lowerTable = $lowerIframe.find('.eto-grid-scroll table');
    adjustTableWidth($lowerTable);

    if(!isSingle) {
      $upperTable = $upperIframe.find('.eto-grid-scroll table');
      adjustTableWidth($upperTable);
      
      alignUpperandlowerDataCols ($lowerTable, $upperTable, 0);
    } else {
      $lowerTable = $lowerIframe.find('.eto-grid-frozen--right table');
      adjustTableWidth($lowerTable);
    }
  }
  
  function alignUpperandlowerDataCols ($lowerTable, $upperTable){
    if($lowerTable.length == 0 || $upperTable.length == 0) {
      return;
    }
    if($lowerTable.css('width') == $upperTable.css('width') + scrollbarWidth) {
      return;
    }
    var upperFrozenCols = getDataColumnWidth($upperTable);
    var lowerFrozenCols = getDataColumnWidth($lowerTable);
    if(upperFrozenCols.length != lowerFrozenCols.length) {
      return;
    }
    
    var colsWidth = [];
    jQuery(upperFrozenCols).each(function(index) {
      if(this['width'] > lowerFrozenCols[index]['width']) {
        colsWidth.push({'width': this['width']});
      } else {
      colsWidth.push({'width': lowerFrozenCols[index]['width']});
      }
    });
    resizeAllColumnWidth($lowerTable, colsWidth);
    resizeAllColumnWidth($upperTable, colsWidth);

  }
  
  function alignUpperandlowerCols ($lowerTable, $upperTable, scrollbarWidth){
    if($lowerTable.length == 0 || $upperTable.length == 0) {
      return;
    }
    if($lowerTable.css('width') == $upperTable.css('width') + scrollbarWidth) {
      return;
    }
      
    var upperFrozenCols = getAllColumnWidth($upperTable);
    var lowerFrozenCols = getAllColumnWidth($lowerTable);
    
    var upperFrozenColWidth = upperFrozenCols[upperFrozenCols.length -1];
    upperFrozenCols.length = upperFrozenCols.length - 1;
    if(scrollbarWidth) {
      upperFrozenColWidth += scrollbarWidth;
    }
    var lowerFrozenColWidth = lowerFrozenCols[lowerFrozenCols.length -1];
    lowerFrozenColWidth.length = lowerFrozenColWidth.length - 1;
    
    var adjustTable, adjustCols, delta;
    if(upperFrozenColWidth > lowerFrozenColWidth) {
      adjustTable = $lowerTable;
      adjustCols = lowerFrozenCols;
      delta = upperFrozenColWidth - lowerFrozenColWidth;
    } else {
      adjustTable = $upperTable;
      adjustCols = upperFrozenCols;
      delta = lowerFrozenColWidth - upperFrozenColWidth;
    }
    
    var wideCols = upperFrozenColWidth > lowerFrozenColWidth? upperFrozenCols : lowerFrozenCols;
    var narrowCols = upperFrozenColWidth > lowerFrozenColWidth? lowerFrozenCols : upperFrozenCols;
    
    var detailsIndex = 0;
    var detailNum = parseInt(adjustTable.find('th[data-column="details"]').attr('detailnum'));
    if(detailNum == NaN) {
      detailNum = 0;
    }
    
    var tagertName = detailNum > 3 ? 'details' : 'dataMeasures';
    jQuery(narrowCols).each(function(index) {
      if(this['name'] == tagertName) {
        detailsIndex = index;
      }
    });
    
    //do not change the width of wideCols, adjust the width of narrowCols
    var firstNarrowColWidth = narrowCols[0]['width'];
    var firstWideColWidth = wideCols[0]['width'];
    delta = delta - ( firstWideColWidth - firstNarrowColWidth);
    narrowCols[0]['width'] = firstWideColWidth;
    //extend the detail/dm column
    narrowCols[detailsIndex]['width'] = narrowCols[detailsIndex]['width'] + delta;

    resizeAllColumnWidth(adjustTable, narrowCols);
  }
  
  function getAllColumnWidth($table) {
    var cols = [];
    if($table) {
      $table.find('thead th').each(function() {
        var columnName = jQuery(this).attr('data-column');
        if(columnName) {
          cols.push({'name': columnName});
        }
      });
      var total = 0;
      $table.find('colgroup col').each(function(index) {
        var width = jQuery(this).css('width');
        if(width) {
          var widthNum = parseFloat(width, 10);
          total += widthNum;
          cols[index]['width'] = widthNum;
        }
      });
      cols[cols.length] = total;
      return cols;
    }
  }
  
  function setScrollerPosition() {
    var lowerIframe = findLowerFrameContent();
    if(lowerIframe && lowerIframe.iFrameResizer) {
      var info = {type:"ready"}, x = getUserData('Left_procFcstVMISearch_titusolang_Standard Viewer: PSI-MPA-SC', -1, 'localStorage'), y = getUserData('Top_procFcstVMISearch_titusolang_Standard Viewer: PSI-MPA-SC', -1, 'localStorage');
      
      x = isNaN(Number(x)) ? x: Number(x);
      y = isNaN(Number(y)) ? y: Number(y);
      info.overrideX = (x > -1) ? x : -1;
      lowerIframe.iFrameResizer.updateScroller(info);
      if(y > -1) {
        setTimeout(rcptop.scrollTo(0, y), 500);
      }
    }

  }
</script>
