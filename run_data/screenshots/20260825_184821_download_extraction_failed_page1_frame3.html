<script language="JavaScript" type="text/javascript">

  function init() {

  
    loadURLs();
  

  }

  function loadURLs(bottomOnly) {
    var wf = rcptop.wfm.currentWF;
    var currentFilter =  rcptop.wfm.currentWF.currentFilter; 
    var url = (currentFilter<wf.filters.length)?wf.filters[currentFilter].URL:wf.URL;
    
    var index = url.indexOf('top=[');
    var index2 = url.indexOf(']&bottom=[');
    var topPage = url.substring(index+5,index2);

    var temp = url.substring(index2+10);
    index2 = temp.lastIndexOf(']');
    var bottomPage = temp.substring(0,index2);

    var extraParam = temp.substring(index2+1);
    var theForm = getHiddenContextForm();
    var orgTarget =  theForm.target;

    if (!bottomOnly) {
      rcptop.wfm.createAndSubmitHiddenContextForm(topPage+extraParam+ '&CombinedPage=true', document.getElementById('top').name);
    }
    rcptop.wfm.createAndSubmitHiddenContextForm(bottomPage+extraParam, document.getElementById('bottom').name);
  }
</script>

<script>
  window.iFrameResizer = {
  
    hasStickyFooter: false,

    onReady: function () {
      window.parentIFrame.size();
      if(!window.jQuery || !window.eto) {
        console.warn('jQuery and edl are required to enable sticky header/footer');
        return;
      }
      if(true) {
        window.iFrameResizer.setupStickyFooter();
      }
      if(window.iFrameResizer.hasStickyFooter) {
        rcptop.sendPageInfo({type:"ready"});
      }
    },

    onMessage: function (info) {
      var x = -1, y = -1;
      if(false) {
        x = getUserData('Left_null', -1, 'localStorage');
        info.overrideX  = (x > -1) ? x : -1;
      } else {
        info.overrideX = -1;
      }
      window.iFrameResizer.adjustHeaderFooter(info);
      if(window.iFrameResize) {
        // relay to nested frames
        var frames = document.querySelectorAll('iframe');
        for (var i = 0; i < frames.length; i++) {
          if(frames[i].contentWindow.parentIFrame) {
            // adjust offsetTop and iframeHeight
            var iFramePosition = frames[i].getBoundingClientRect(), bodyPosition = document.body.getBoundingClientRect();
            var offsetTop = parseInt(iFramePosition.top  - bodyPosition.top,  10);
            var clonedInfo = JSON.parse(JSON.stringify(info));
            clonedInfo.iframeHeight = iFramePosition.height;
            clonedInfo.offsetTop = clonedInfo.offsetTop + offsetTop;
            var message = JSON.stringify(clonedInfo);
            frames[i].contentWindow.postMessage('[iFrameSizer]message:'+message, window.iFrameResizer.targetOrigin);
          }
        }
      }
    },

    setupStickyFooter: function () {
      var footer = window.jQuery('.sticky-footer');
      var grid = window.jQuery('.eto-grid .eto-grid-scroll:visible');
      if(footer.length) {
        // wrap footer inside a div with right style
        footer.wrap('<div class="sticky-footer-wrapper" '+
          'style="clear:both;position:relative;width:100%;background-color:white;z-index:10;transition:opacity 0.2s;opacity:1;"></div>');
        var wrapper = window.jQuery('.sticky-footer-wrapper');
        if(grid.length) {
          // setup grid header style
          var gridHeaders = window.jQuery('.eto-grid thead th');
          gridHeaders.css({position:'relative', 'z-index':10, transition:'opacity 0.2s', opacity:1});

          // insert scroller before footer
          wrapper.prepend('<div class="footer-scroller" style="height:18px;overflow-y:hidden;overflow-x:auto;">'+
            '<div class="footer-scroller-inner" style="height:1px">&nbsp;</div></div>');
          var scroller = window.jQuery('.sticky-footer-wrapper .footer-scroller');

          // sync grid scroller
          var syncFunc = function() {
            var master = window.jQuery(this);
            var slave = master.hasClass('footer-scroller') ? grid : scroller;
            slave.off('scroll', null, syncFunc);
            slave.scrollLeft(master.scrollLeft());
            //Save to localStorage
            
            clearTimeout(window.iFrameResizer.syncTimer);
            window.iFrameResizer.syncTimer = setTimeout(function() {
              window.iFrameResizer.syncTimer = null;
              slave.on('scroll', syncFunc);
            }, 200);
          }
          scroller.on('scroll', syncFunc);
          grid.on('scroll', syncFunc);

          // attach grid listener
          var g = new eto.Grid({el: grid.parent()[0]});
          g.on('columnResize columnAction', window.iFrameResizer.updateScroller);
        }else {
          wrapper.prepend('<hr>');
        }
        wrapper.after('<div class="sticky-footer-wrapper-tail" style="clear:both;display:block;" />');
        window.iFrameResizer.hasStickyFooter = true;
      }
    },
    
    adjustHeaderFooter: function(info) {
      if(!window.iFrameResizer.hasStickyFooter) {
        return;
      }
      var result = window.iFrameResizer.calculateY(info);
      // hide header/footer if need to move them
      if(result.header && result.headerY != 0) {
        result.header.css({opacity:0});
      }
      if(result.footer && result.footerY != 0) {
        result.footer.css({opacity:0});
      }

      clearTimeout(window.iFrameResizer.delayTimer);
      window.iFrameResizer.delayTimer = setTimeout(function() {
        window.iFrameResizer.delayTimer = null;
        // move header/footer and show them
        if(result.header) {
          result.header.css({opacity:1,transform: 'translateY(' + result.headerY + 'px)', '-webkit-transform': 'translateY(' + result.headerY + 'px)'});
          //Save to localStorage
          
        }
        if(result.footer) {
          result.footer.css({opacity:1,transform: 'translateY(' + result.footerY + 'px)', '-webkit-transform': 'translateY(' + result.footerY + 'px)'});
        }
        window.iFrameResizer.updateScroller(info);
      }, 200);
    },

    calculateY: function (info) {
      var result = {};
      var tail = window.jQuery('.sticky-footer-wrapper-tail');
      var wrapper = window.jQuery('.sticky-footer-wrapper');
      var gridHeight = Infinity;
      if(wrapper.length) {
        var grid = window.jQuery('.eto-grid .eto-grid-scroll:visible');
        if(grid.length) {
          var gridBody = grid.find('tbody');
          gridHeight = Math.max(gridBody.outerHeight(true) - gridBody.find('tr').first().outerHeight(true), 0);
          var gridHeaders = window.jQuery('.eto-grid thead th');
          // translate header down when scroll past its top
          result.header = gridHeaders;
          result.headerY = Math.min(gridHeight, Math.max(info.headerOffset + info.scrollTop - info.offsetTop - grid.offset().top, 0));
        }

        // translate footer up
        result.footer = wrapper;
        result.footerY = Math.max(-gridHeight, Math.min(info.viewportHeight + info.scrollTop - info.offsetTop - tail.offset().top, 0));
      }
      return result;
    },

    updateScroller: function (info) {
      var wrapper = window.jQuery('.sticky-footer-wrapper');
      if(wrapper.length) {
        var grid = window.jQuery('.eto-grid .eto-grid-scroll:visible');
        if(grid.length) {
          var scroller = window.jQuery('.sticky-footer-wrapper .footer-scroller');
          var scrollerInner = window.jQuery('.sticky-footer-wrapper .footer-scroller .footer-scroller-inner');
          var gridWidth = grid.outerWidth(true);
          var gridInnerWidth = window.jQuery('.eto-grid .eto-grid-scroll table').outerWidth(true);

          if(info && info.overrideX && info.overrideX > -1) {
            grid.scrollLeft(info.overrideX);
          }
                    
          // update scroller width & position
          scrollerInner.outerWidth(gridInnerWidth);
          scroller.outerWidth(gridWidth);
          scroller.scrollLeft(grid.scrollLeft());
          scroller.offset({left : grid.offset().left});

          // hide or show scroller
          if('true' === grid.closest('.eto-grid').attr('data-no-scroller') || grid.is(':hidden')) {
            grid.css({'margin-bottom': '0px'});
            scroller.hide();
          } else {
            // hide native scroller
            grid.css({'margin-bottom': '-18px'});
            scroller.show();
          }
        }
      }
    },

    targetOrigin: window.location.origin ||
      window.location.protocol + "//" + window.location.hostname + (window.location.port ? ':' + window.location.port: '')
  };

  window.addEventListener('click', function(event) {
    if(this != rcptop) {
      rcptop.jQuery(rcptop.document).find('body').click();
    }
  });
  
  if(window.name === 'side_frame'|| window.name === 'sticky_frame' || window.top === window.self) {
    // attach window resize/scroll event when not inside iframe
    (function(undefined) {
      var prev = 0;
      var sendPageInfo = function(event) { var now = Date.now(); if(now - prev > 9) {
        prev = now;
        var bodyPosition = document.body.getBoundingClientRect(),
          info = {
            iframeHeight: bodyPosition.height,
            viewportHeight: Math.max(document.documentElement.clientHeight, window.innerHeight || 0),
            offsetTop: 0,
            scrollTop: window.pageYOffset,
            headerOffset: 0,
            type: event.type
          };
          window.iFrameResizer.onMessage(info);
        }};
        window.addEventListener('load', function(event) {
        window.iFrameResizer.setupStickyFooter();
        sendPageInfo(event);
      });
      window.addEventListener('resize', sendPageInfo);
      window.addEventListener('scroll', sendPageInfo);
      window.jQuery(window).on('sendPageInfo', sendPageInfo);
      window.sendPageInfo = sendPageInfo;
    })();
  } else if(window.frameElement && window.frameElement.id === 'popupModal') {
    // attach window resize/scroll event inside popup modal
    (function(undefined) {
      var prev = 0;
      var modalBody = jQuery(window.frameElement).closest('.eto-modal__body')[0];
      var sendPageInfo = function(event) { var now = Date.now(); if(now - prev > 9) {
        prev = now;
        var bodyPosition = document.body.getBoundingClientRect(), 
          modalBodyPadding = (modalBody) ? parseFloat(window.top.getComputedStyle(modalBody).paddingTop) : 0,
          info = {
            iframeHeight: bodyPosition.height,
            viewportHeight: modalBody.clientHeight || 0,
            offsetTop: modalBodyPadding || 0,
            scrollTop: modalBody.scrollTop,
            headerOffset: 0,
            type: event.type
          };
        window.iFrameResizer.onMessage(info);
      }};
      window.addEventListener('load', function(event) {
        sendPageInfo(event);
      });
      
      if(modalBody) {
        modalBody.addEventListener('scroll', sendPageInfo);
        modalBody.addEventListener('resize', sendPageInfo); 
      }
      jQuery(window).resize(sendPageInfo);
      jQuery(window).scroll(sendPageInfo);
      window.jQuery(window).on('sendPageInfo', sendPageInfo);
    })();
  }  

 
  //Force resize of the iframes based on the open menu
  jQuery('.eto-dropdown').each(function(index, elem) {
    var dropdown = new eto.Dropdown({el: elem});
    dropdown.on('opened', function() {
      //Remove marker from all menus before adding to the one that is open
      jQuery('.eto-dropdown__menu[data-iframe-height]').removeAttr('data-iframe-height');
      jQuery(':not(.eto-dropdown) .eto-dropdown__menu[data-affixed]').attr('data-iframe-height','');
    });
    dropdown.on('closed', function() {
      jQuery('.eto-dropdown .eto-dropdown__menu[data-iframe-height]').removeAttr('data-iframe-height');
    });
  });

  if (typeof initFormValidation === "function") {
    // call initFormValidation of Common.jsp to handler button click event when any validation failed
    initFormValidation();
  }
</script>
